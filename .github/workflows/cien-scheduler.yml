name: CIEN - Envio Automatico de Informes
# Actualizado: 2026-08-17 — forzar reconocimiento de schedule

on:
  schedule:
    - cron: '5 4 * * *'   # 11:05 PM Colombia (UTC-5)
  workflow_dispatch:
    inputs:
      aliado_id:
        description: 'ID del aliado específico (dejar vacío para todos)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no envía correos, solo verifica)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: read

jobs:
  enviar-informes:
    name: Enviar Informes CIEN
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependencias
        run: npm install

      - name: 🚀 Ejecutar pipeline de informes
        env:
          NOCODB_API_URL:                   ${{ secrets.NOCODB_API_URL }}
          NOCODB_API_TOKEN:                 ${{ secrets.NOCODB_API_TOKEN }}
          NOCODB_TABLE_ALIADOS:             ${{ secrets.NOCODB_TABLE_ALIADOS }}
          NOCODB_TABLE_ALIADO_INFORMES:     ${{ secrets.NOCODB_TABLE_ALIADO_INFORMES }}
          NOCODB_TABLE_ALIADO_CONFIG_ENVIO: ${{ secrets.NOCODB_TABLE_ALIADO_CONFIG_ENVIO }}
          EMAILJS_SERVICE_ID:  ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY:  ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          DASHBOARD_BASE_URL:   ${{ secrets.DASHBOARD_BASE_URL }}
          REPORT_TOKEN_SECRET:  ${{ secrets.REPORT_TOKEN_SECRET }}
          GH_TOKEN:    ${{ secrets.GH_TOKEN }}
          GH_OWNER:    ${{ secrets.GH_OWNER }}
          GH_REPO:     ${{ secrets.GH_REPO }}
          GH_BRANCH:   ${{ secrets.GH_BRANCH }}
          GH_BASEPATH: ${{ secrets.GH_BASEPATH }}
          GH_CDN_BASE: ${{ secrets.GH_CDN_BASE }}
          RUN_MODE:  'github-actions'
          LOG_LEVEL: 'info'
          ALIADO_ID_FILTER: ${{ github.event.inputs.aliado_id }}
          DRY_RUN:          ${{ github.event.inputs.dry_run }}
        run: node pipeline/run-once.js

      - name: 📋 Guardar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cien-scheduler-log-${{ github.run_number }}
          path: pipeline-run.log
          retention-days: 30
          if-no-files-found: ignore
